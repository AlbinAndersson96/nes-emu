[package]
name = "nes-emu"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = { version = "0.30.13", features = ["serde"] }
egui = "0.35"
egui-winit = "0.35"
egui-wgpu = { version = "0.35", features = ["winit", "wayland", "x11"] }
pollster = "0.3"
fontdue = "0.9"
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
png = "0.17"

# A cycle-accurate NES core is compute-heavy: at opt-level 0 the emulation loop
# alone costs ~20 ms/frame (~49 fps ceiling), so a plain `cargo run` can't hold
# the 16.639 ms NTSC frame budget and games run in slow motion. opt-level 1 cuts
# that to ~3 ms/frame (~320 fps ceiling) while keeping debug info and quick
# incremental builds. Dependencies are optimized fully — they compile once and
# cache, and it keeps the egui/wgpu present path fast too. `--release` (~2.5 ms)
# is still a touch faster for shipping.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
