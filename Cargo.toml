[package]
name = "nes-emu"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = { version = "0.28", features = ["serde"] }
pixels = "0.13"
fontdue = "0.9"
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
png = "0.17"
